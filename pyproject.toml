[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-in-nothing"
version = "0.1.0"
description = "Model-free, bounded evolutionary program-synthesis research prototype"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mamdouh Aboammar" }
]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
]
keywords = [
    "program-synthesis",
    "evolutionary-computation",
    "formal-methods",
    "model-free",
    "program-induction",
    "finite-domain-verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "pytest-benchmark>=4.0",
    "psutil>=5.9",
]


[project.scripts]
cin = "cin.__main__:main"

[project.urls]
Homepage = "https://github.com/imMamdouhaboammar/code-in-nothing"
Repository = "https://github.com/imMamdouhaboammar/code-in-nothing"
Issues = "https://github.com/imMamdouhaboammar/code-in-nothing/issues"
Documentation = "https://github.com/imMamdouhaboammar/code-in-nothing/tree/main/docs"

[tool.setuptools.packages.find]
include = ["cin*"]

[tool.setuptools.package-data]
cin = ["schemas/*.json", "examples/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
