# Code in Nothing: runtime-validated finite-domain CLAMP3 task specification (v0.3 multi-input).
api_version: cin.world/v0.3
id: cin.world.logic.clamp3.001
family: comparisons
input_types: [Int, Int, Int]
return_type: Int
input_domain:
  x: { min: -2, max: 2 }
  low: { min: -2, max: 2 }
  high: { min: -2, max: 2 }
precondition:
  lte: [low, high]
postcondition:
  or:
    - and:
        - lte: [x, low]
        - eq: [result, low]
    - and:
        - gte: [x, high]
        - eq: [result, high]
    - and:
        - gte: [x, low]
        - lte: [x, high]
        - eq: [result, x]
validation:
  require_typed_spec: true
  require_admissible_grammar_witness: true
  witness_visibility: verifier_only
  unknown_is_not_pass: true
