# Code in Nothing: runtime-validated finite-domain MEDIAN3 task specification (v0.3 multi-input).
api_version: cin.world/v0.3
id: cin.world.logic.median3.001
family: comparisons
input_types: [Int, Int, Int]
return_type: Int
input_domain:
  x: { min: -2, max: 2 }
  y: { min: -2, max: 2 }
  z: { min: -2, max: 2 }
precondition:
  and:
    - lte: [x, 2]
    - gte: [x, -2]
postcondition:
  or:
    - and:
        - or:
            - and: [{ lte: [x, y] }, { lte: [y, z] }]
            - and: [{ lte: [z, y] }, { lte: [y, x] }]
        - eq: [result, y]
    - and:
        - or:
            - and: [{ lte: [y, x] }, { lte: [x, z] }]
            - and: [{ lte: [z, x] }, { lte: [x, y] }]
        - eq: [result, x]
    - and:
        - or:
            - and: [{ lte: [x, z] }, { lte: [z, y] }]
            - and: [{ lte: [y, z] }, { lte: [z, x] }]
        - eq: [result, z]
validation:
  require_typed_spec: true
  require_admissible_grammar_witness: true
  witness_visibility: verifier_only
  unknown_is_not_pass: true
