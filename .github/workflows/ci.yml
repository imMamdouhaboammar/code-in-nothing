name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate schemas and contracts
        run: |
          python -m cin validate

      - name: Run unit and integration tests
        run: |
          python -m pytest -q

      - name: Run predefined five-seed experimental ablation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python experiments/run_guided.py --seeds 0 1 2 3 4 --proposals 250 --output runs/ci-guided-ablation.json

      - name: Publish complete experimental ablation record
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cin-guided-ablation
          path: runs/ci-guided-ablation.json
          if-no-files-found: error

      - name: Reproduce tier-1 mathematical synthesis evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python experiments/run_m1.py

      - name: Run demonstration experiment (canonical baseline)
        run: |
          python -m cin demo --seed 0 --max-evals 250 --output runs/ci-baseline

      - name: Run control ablation (frozen world)
        run: |
          python -m cin demo --seed 0 --max-evals 250 --no-world-evolution --output runs/ci-frozen-world

      - name: Run control ablation (no inheritance)
        run: |
          python -m cin demo --seed 0 --max-evals 250 --no-inheritance --output runs/ci-no-inheritance

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Ruff check
        run: uv run --with ruff ruff check .

      - name: Run Ruff format check
        run: uv run --with ruff ruff format --check .
